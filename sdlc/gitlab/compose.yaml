name: sdlc-demo
services:
  gitlab:
    image: ${GITLAB_IMAGE:?Execute prepare}
    hostname: gitlab
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 8g
    cpus: 4
    networks: [core]
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:${GITLAB_PORT:-3180}'
        nginx['listen_port'] = 3180
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/root_password').strip
        gitlab_rails['gitlab_signup_enabled'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 0
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        gitlab_rails['backup_keep_time'] = 0
    secrets: [root_password]
    volumes: [config:/etc/gitlab, logs:/var/log/gitlab, data:/var/opt/gitlab]
    healthcheck:
      test: [CMD, /opt/gitlab/embedded/bin/curl, --fail, --max-time, "10", "http://127.0.0.1:3180/-/readiness"]
      interval: 30s
      timeout: 15s
      retries: 40
      start_period: 120s
  runner:
    image: ${RUNNER_IMAGE:?Execute prepare}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    networks: [core]
    volumes: [./.secrets/runner:/etc/gitlab-runner, builds:/builds, release:/release]
    depends_on:
      gitlab: {condition: service_healthy}
  demo:
    image: ${RUNNER_IMAGE:?Execute prepare}
    entrypoint: [python3, -m, http.server, "8090", --directory, /release]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    networks: [core]
    volumes: [release:/release:ro]
  entry:
    image: ${ENTRY_IMAGE:?Execute prepare}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 64m
    entrypoint: [nginx, -c, /etc/nginx/demo.conf, -g, "daemon off;"]
    volumes: [./nginx.conf:/etc/nginx/demo.conf:ro]
    networks: [front, core]
    ports: ["127.0.0.1:${GITLAB_PORT:-3180}:3180", "127.0.0.1:${DEMO_PORT:-3181}:3181"]
    depends_on: [gitlab, demo]
networks:
  front:
    ipam:
      config: [{subnet: "${GITLAB_FRONT_SUBNET:?Execute prepare}"}]
  core:
    internal: true
    ipam:
      config: [{subnet: "${GITLAB_CORE_SUBNET:?Execute prepare}"}]
volumes:
  config:
  logs:
  data:
  builds:
  release:
secrets:
  root_password: {file: ./.secrets/root_password}
