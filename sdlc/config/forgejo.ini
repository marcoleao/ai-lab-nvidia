APP_NAME = SDLC Local - Backlog
RUN_USER = git
WORK_PATH = /var/lib/gitea
RUN_MODE = prod

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/forgejo.db

[repository]
ROOT = /var/lib/gitea/git/repositories
DEFAULT_PRIVATE = private
FORCE_PRIVATE = true
DISABLE_HTTP_GIT = true
DISABLED_REPO_UNITS = repo.actions,repo.wiki,repo.pulls,repo.packages

[server]
APP_DATA_PATH = /var/lib/gitea/data
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://127.0.0.1:3101/
DISABLE_SSH = true
OFFLINE_MODE = true
LFS_START_SERVER = false

[security]
INSTALL_LOCK = true
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.0/8,::1/128
PASSWORD_HASH_ALGO = pbkdf2

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
ENABLE_REVERSE_PROXY_AUTHENTICATION = false
ENABLE_NOTIFY_MAIL = false
ENABLE_CAPTCHA = false

[mailer]
ENABLED = false

[actions]
ENABLED = false

[oauth2]
ENABLED = false

[packages]
ENABLED = false

[cron.update_checker]
ENABLED = false

[cron.repo_health_check]
ENABLED = false

[log]
MODE = console
LEVEL = Warn
