[project]
name = "ai-local-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.10.1",
  "datasets==4.1.1",
  "huggingface-hub==0.34.4",
  "jupyterlab==4.4.7",
  "langchain==0.3.27",
  "langgraph==0.6.7",
  "openai==1.109.1",
  "qdrant-client==1.15.1",
  "transformers==4.56.2",
]

[tool.uv]
package = false
# PyTorch + CUDA are supplied by the pinned base image, checked at build/run time.
override-dependencies = ["torch; sys_platform == 'never'"]
environments = ["sys_platform == 'linux'"]
