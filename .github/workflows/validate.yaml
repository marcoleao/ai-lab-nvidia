name: Validate IaC
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  platform-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: operations/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native tests, CLI and installed release in a disposable source snapshot
        run: sh operations/validate.sh --mode unit --report .cache/platform-validation/native-${{ matrix.target }}.json
      - name: Preserve safe validation receipt, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-validation-native-${{ matrix.target }}
          path: .cache/platform-validation/native-${{ matrix.target }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  platform-windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows bootstrap and GPU provider fixtures without Go executables
        run: python operations/scripts/validation.py --mode windows --report .cache/platform-validation/windows-bootstrap.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-validation-windows-bootstrap
          path: .cache/platform-validation/windows-bootstrap.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  platform-integration:
    needs: platform-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: operations/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real private network, access, observability and Homepage with owned cleanup
        run: sh operations/validate.sh --mode integration --disposable --report .cache/platform-validation/docker-${{ matrix.target }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-validation-docker-${{ matrix.target }}
          path: .cache/platform-validation/docker-${{ matrix.target }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  platform-cli-build:
    needs: [platform-cli, platform-windows-bootstrap, platform-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: operations/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-validation-*
          path: .cache/platform-validation/evidence
          merge-multiple: true
      - name: Require six successful reports for this commit, run and exact sources
        run: python operations/scripts/release-gate.py --reports .cache/platform-validation/evidence --receipt .cache/platform-packages/validation.json
      - name: Build package only after native validation and real Docker integration
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ".cache/platform/${GOOS}-${GOARCH}"
          go -C operations build -trimpath -o "$PWD/.cache/platform/${GOOS}-${GOARCH}/platform" ./cmd/platform
          sh operations/scripts/package-cli.sh "${GOOS}-${GOARCH}" ".cache/platform/${GOOS}-${GOARCH}/platform" .cache/platform-packages
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            .cache/platform-packages/*.tar.gz
            .cache/platform-packages/*.sha256
            .cache/platform-packages/validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  portal-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sdlc/portal
    env:
      DATABASE_URL: postgresql://sdlc:disposable-ci-only@localhost:5432/portal_test
      TEST_DATABASE_URL: postgresql://sdlc:disposable-ci-only@localhost:5432/portal_test
      DEMO_MODE: 'true'
      PORTAL_ORIGIN: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:4100
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: portal_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sdlc -d portal_test" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare workspace
        run: npm install --global pnpm@12.14.0 && pnpm install --frozen-lockfile
      - name: Generate database client and apply isolated migrations
        run: pnpm db:generate && pnpm db:setup
      - name: Administrative audit contracts
        run: |
          sudo python3 -m unittest discover -s ../tests -p 'test_audit_admin.py' -v
          python3 ../scripts/reconcile_docker_network_tests.py
          python3 ../tests/test_wsl_clock.py
          python3 tests/regression-runner.test.py
      - name: Local inference relay contracts
        run: |
          python3 tests/relay_tests.py
          python3 tests/coding-executor.test.py
          python3 tests/coding-ui-agent.test.py
          python3 tests/dev-ai-executor.test.py
          python3 tests/coding-micro.test.py
          node --test tests/browser-controls.test.mjs
      - name: Browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Registered backend and browser regression
        run: pnpm regression:ci
      - name: Regression reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-regression-${{ github.run_attempt }}
          path: sdlc/portal/test-results/regression/
          if-no-files-found: warn
          retention-days: 7
  vscode-extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension contracts
        run: node --test vscode/test/client.test.js vscode/test/host.test.js
  sdlc-portal-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Human portal browser acceptance
        run: >-
          docker run --rm --init --shm-size=512m
          -v "$PWD/sdlc/services/control:/src:ro"
          -v "$PWD/vscode:/extension:ro"
          mcr.microsoft.com/playwright/python:v1.55.0-noble
          bash /src/test-browser.sh
  sdlc-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: control_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_test -d control_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control test dependencies
        run: python -m pip install -r sdlc/services/control/requirements.txt
      - name: GitLab local delivery contracts
        run: python -m unittest discover -s sdlc/gitlab -p 'test_*.py' -v
      - name: PostgreSQL control integration and migration tests
        working-directory: sdlc/services/control
        env:
          CONTROL_TEST_DATABASE_URL: postgresql+psycopg://control_test:disposable-ci-only@localhost/control_test
        run: python -m pytest -p no:cacheprovider -q
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Platform host installer without provisioning
        shell: powershell
        run: ./tests/platform-installer.tests.ps1
      - name: Platform Windows driver adapter without hardware or Windows Update
        shell: powershell
        run: ./tests/platform-windows-gpu.tests.ps1
      - name: Cleanup destructive path guards
        shell: powershell
        run: ./tests/cleanup-environment.tests.ps1
      - name: Host elevation and NVIDIA provisioning contracts
        shell: powershell
        run: ./tests/host-prerequisites.tests.ps1
      - name: PowerShell syntax and destructive path guards
        shell: powershell
        run: ./lab/tests/validate.ps1
      - name: SDLC configuration and governance contracts
        shell: powershell
        run: ./sdlc/bootstrap.ps1 validate
      - name: Complete SDLC installer contracts without provisioning
        shell: powershell
        run: ./sdlc/tests/install.tests.ps1
      - name: Minimal LAB profile selection contracts
        shell: powershell
        run: ./lab/tests/sdlc-profile.tests.ps1
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Complete installation guards without Docker or inference
        run: python3 sdlc/portal/tests/installation-check.test.py
      - name: Pinned SDLC image cache and failed registry contracts
        run: python3 -m unittest discover -s sdlc/tests -p 'test_pinned_images.py' -v
      - name: Shell, Compose, lock, Python and Docker build gates
        run: bash lab/scripts/linux/quality-gates.sh
      # GPU smoke tests are executed by bootstrap/ai test on the workstation.
